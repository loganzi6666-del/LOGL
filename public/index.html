<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>LOGL — AI 지정학 시뮬레이션</title>
    <link rel="stylesheet" href="/css/style.css" />
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='26' font-size='26'>🌍</text></svg>"
    />
  </head>
  <body>
    <!-- ── Start screen ──────────────────────────────────────────────────── -->
    <div id="start" class="overlay">
      <div class="start-card">
        <header class="start-head">
          <h1>LOGL</h1>
          <p class="lede">
            실제 국경과 실제 국력으로 시작하는 지정학 시뮬레이션.
            각 나라는 자국의 이익에 따라 스스로 움직이고, 당신이 얻은 땅은 지도에 그대로 반영됩니다.
          </p>
          <p id="ai-status" class="ai-status"></p>
        </header>

        <label class="field">
          <span>어느 나라를 이끌겠습니까?</span>
          <input id="nation-search" type="search" placeholder="국가 이름 검색 (한국, 미국, Germany…)" autocomplete="off" />
        </label>
        <div id="nation-list" class="nation-list" role="listbox" aria-label="플레이할 국가"></div>

        <div id="nation-detail" class="nation-detail" hidden></div>

        <div class="start-actions">
          <label class="field inline">
            <span>시드 <small>(같은 시드는 같은 세계)</small></span>
            <input id="seed" type="text" placeholder="비워두면 무작위" autocomplete="off" />
          </label>
          <button id="start-btn" class="primary" disabled>게임 시작</button>
        </div>

        <details class="saves-block">
          <summary>저장된 게임 불러오기</summary>
          <div id="saves-list" class="saves-list">저장된 게임이 없습니다.</div>
        </details>
      </div>
    </div>

    <!-- ── Main shell ────────────────────────────────────────────────────── -->
    <div id="shell" class="shell" hidden>
      <header class="topbar">
        <div class="brand">
          <strong>LOGL</strong>
          <span id="date-label" class="date">—</span>
        </div>
        <div id="player-chip" class="player-chip"></div>
        <div class="topbar-actions">
          <button id="fit-btn" class="ghost" title="전체 지도 보기">전체 보기</button>
          <button id="home-btn" class="ghost" title="우리나라로 이동">우리나라</button>
          <button id="theme-btn" class="ghost" title="밝게/어둡게">◑</button>
          <button id="save-btn" class="ghost">저장</button>
        </div>
      </header>

      <main class="layout">
        <!-- Left: our own situation -->
        <aside class="panel left">
          <section class="block">
            <h2>국가 현황</h2>
            <div id="stat-grid" class="stat-grid"></div>
          </section>

          <section class="block">
            <h2>전쟁</h2>
            <div id="wars" class="list">평화 상태입니다.</div>
          </section>

          <section class="block">
            <h2>주요 관계</h2>
            <div id="relations" class="list"></div>
          </section>

          <section class="block">
            <h2 class="with-aside">
              범례
              <button id="legend-toggle" class="ghost tiny" aria-expanded="true">접기</button>
            </h2>
            <div id="legend" class="legend"></div>
          </section>
        </aside>

        <!-- Centre: the world -->
        <section class="map-wrap">
          <canvas id="map"></canvas>
          <div id="tooltip" class="tooltip" hidden></div>
          <div id="map-busy" class="map-busy" hidden><span class="spinner"></span><span id="busy-text">턴 처리 중…</span></div>
        </section>

        <!-- Right: selection and news -->
        <aside class="panel right">
          <section class="block" id="selection-block">
            <h2>선택한 지역</h2>
            <div id="selection" class="selection">지도를 클릭해 지역을 선택하세요.</div>
          </section>

          <section class="block grow">
            <h2 class="with-aside">
              정세 보고
              <span id="report-turn" class="muted tiny"></span>
            </h2>
            <div id="report" class="report">게임을 시작하면 매달 보고가 올라옵니다.</div>
          </section>
        </aside>
      </main>

      <!-- Bottom: the order bar -->
      <footer class="commandbar">
        <div id="pending" class="pending" hidden></div>
        <div class="command-row">
          <textarea
            id="command"
            rows="1"
            placeholder="예: 북한에 선전포고하고 개성으로 전 병력을 투입하라 / 5개 사단 증강 / 경제에 20 투자 / 일본과 관계 개선 / 북한 군사력 어때?"
          ></textarea>
          <button id="interpret-btn" class="secondary">해석</button>
          <button id="turn-btn" class="primary">턴 종료 ▸</button>
        </div>
        <div id="command-hint" class="hint"></div>
      </footer>
    </div>

    <div id="toast" class="toast" hidden></div>
    <script type="module" src="/dist/app.js"></script>
  </body>
</html>
